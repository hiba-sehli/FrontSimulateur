@if (!item().hidden) {
  @if (item().url && !item().external) {
    <li class="cyber-nav-item" [ngClass]="item().classes" [routerLinkActive]="['active']">
      <a class="cyber-nav-link" [target]="item().target ? '_blank' : '_self'" [routerLink]="[item().url]" (click)="closeOtherMenu($event)">
        <ng-container *ngTemplateOutlet="itemIcon"></ng-container>

        @if (item().icon) {
          <span class="cyber-nav-text">{{ item().title }}</span>
        } @else {
          {{ item().title }}
        }
        <span class="cyber-nav-glow"></span>
      </a>
    </li>
  }
  @if (item().url && item().external) {
    <li class="cyber-nav-item" [ngClass]="item().classes">
      <a class="cyber-nav-link" [target]="item().target ? '_blank' : '_self'" [href]="item().url">
        <ng-container *ngTemplateOutlet="itemIcon"></ng-container>
        @if (item().icon) {
          <span class="cyber-nav-text">{{ item().title }}</span>
        } @else {
          {{ item().title }}
        }
        <span class="cyber-nav-glow"></span>
      </a>
    </li>
  }
  <ng-template #itemIcon>
    @if (item().icon) {
      <span class="cyber-nav-icon"><i class="feather" [ngClass]="item().icon"></i></span>
    }
  </ng-template>
}
